name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Тесты (rake test)
        run: bundle exec rake test

      - name: Сгенерировать и проверить 4 провайдера
        run: |
          for p in provider_api:novapay bluepay_api:bluepay swiftpay_api:swiftpay europay_api:europay; do
            spec="examples/${p%%:*}.yaml"; name="${p##*:}"
            ruby exe/integrate --spec "$spec" --provider "$name"
            ruby -c "output/${name}_service.rb"
            ruby exe/integrate verify --dir output
          done

      - name: RuboCop (совещательно)
        continue-on-error: true
        run: bundle exec rubocop

      - name: Build isolated verifier
        run: docker build -f verification/Dockerfile -t paybridge-verifier:local .

      - name: Verify isolation and generated integrations
        env:
          PAYBRIDGE_DOCKER_TESTS: '1'
        run: bundle exec ruby -Itest test/test_verification_runner.rb
