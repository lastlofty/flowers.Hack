name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Тесты гоняет workflow "Ruby tests" (test.yml). Здесь — только линтеры,
# совещательно (не блокируют сборку): rubocop для Ruby и openapi_lint для примеров.
jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: RuboCop (совещательно)
        continue-on-error: true
        run: bundle exec rubocop

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Линт примеров спецификаций (Python-модуль)
        run: |
          for f in examples/provider_api.yaml examples/bluepay_api.yaml examples/swiftpay_api.yaml examples/europay_api.yaml; do
            ruby exe/integrate lint --spec "$f"
          done
