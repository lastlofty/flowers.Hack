name: Ruby tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # единый источник версии — .ruby-version
          bundler-cache: true
      # Python нужен для тестов линтера (tools/openapi_lint.py); на Windows
      # проверяем кросс-платформенную кодировку вывода линтера.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bundle exec rake test
